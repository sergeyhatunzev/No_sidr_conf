name: Debug VLESS checker with Xray

on:
  workflow_dispatch:     # ← кнопка "Run workflow" в интерфейсе GitHub

jobs:
  debug-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Качаем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Ставим Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Ставим все библиотеки, которые есть в твоём скрипте
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install rich requests psutil urllib3

      # 4. Качаем самый свежий Xray (linux 64-bit)
      - name: Download latest Xray
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip xray.zip -d xray_bin
          chmod +x xray_bin/xray
          mv xray_bin/xray ./xray
          ls -la ./xray
          ./xray version || echo "Xray version command failed"

      # 5. Показываем, что лежит рядом с xray (чтоб понять, есть ли твой скрипт)
      - name: Show directory contents
        run: |
          pwd
          ls -la
          echo "Если здесь нет твоего .py файла — положи его в репозиторий!"

      # 6. Запускаем твой скрипт и показываем ВСЁ, что он выводит
      - name: Run your checker script (with full output)
        run: |
          echo "========================================"
          echo "Запускаем скрипт..."
          echo "========================================"
          
          # ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←
          # Замени имя файла на своё реальное!!!
          python test_two_reality.py   # например: python sidr_checker.py
          # или python main.py
          # или python check_vless.py
          # ↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑

          echo "========================================"
          echo "Скрипт завершился. Смотри выше все сообщения и ошибки"
          echo "========================================"


     

      # 8. Показываем последние 30 строк лога (на всякий случай)
      - name: Show last lines of output
        if: always()
        run: tail -n 30 $GITHUB_STEP_SUMMARY || echo "Нет лога"
