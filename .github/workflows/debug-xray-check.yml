name: Debug VLESS checker with Xray

on:
  workflow_dispatch:

jobs:
  debug-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Качаем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Ставим Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Устанавливаем библиотеки
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install rich requests psutil urllib3

      # 4. Скачиваем и готовим Xray (самый важный исправленный шаг)
      - name: Download and prepare latest Xray
        run: |
          echo "Скачиваем Xray..."
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          
          echo "Распаковываем прямо в текущую папку..."
          unzip -o xray.zip xray
          
          echo "Даём права на исполнение..."
          chmod +x xray
          
          echo "Проверяем, что файл существует и исполняемый:"
          ls -la xray
          ls -l xray
          file xray
          
          echo "Пробуем запустить версию:"
          ./xray version || echo "Не удалось запустить ./xray version"

      # 5. Показываем содержимое директории
      - name: Show current directory contents
        run: |
          pwd
          ls -la
          echo ""
          echo "Должны быть видны: xray, test_two_reality.py (или твой .py), возможно sidr_vless.txt"

      # 6. Запускаем скрипт с максимальной диагностикой
      - name: Run checker script with debug
        run: |
          echo "========================================"
          echo "Запускаем скрипт test_two_reality.py"
          echo "========================================"
          
          echo "Проверяем наличие xray перед запуском:"
          ls -l xray || echo "xray НЕ НАЙДЕН"
          echo "Права на xray:"
          ls -l xray
          
          echo "Проверяем наличие скрипта:"
          ls -l test_two_reality.py || echo "Скрипт НЕ НАЙДЕН!"
          
          echo ""
          echo "Запускаем python -u (unbuffered):"
          python -u test_two_reality.py 2>&1 || echo "Скрипт завершился с ошибкой, код возврата: $?"
          
          echo ""
          echo "========================================"
          echo "Выполнение скрипта завершено"
          echo "========================================"

      # 7. Показываем результат (если файл создан)
      - name: Show working proxies file (if any)
        if: always()
        run: |
          if [ -f sidr_vless_work.txt ]; then
            echo "sidr_vless_work.txt существует:"
            head -n 10 sidr_vless_work.txt || echo "Файл пустой"
            wc -l sidr_vless_work.txt
          else
            echo "sidr_vless_work.txt НЕ создан"
          fi

      # 8. Финальный хвост логов (на всякий случай)
      - name: Final log tail
        if: always()
        run: echo "Конец логов"
